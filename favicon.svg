<!--
  取自 logo-black.svg 的 Vector_13 路径——wordmark「Róng 融 / MoA 美术馆」里独立成字的
  「融」，不是新画的字形。选它做 favicon 的理由：
  1. 全站没有单独的图标/monogram 设计稿节点，favicon 必须从现有 wordmark 提炼，
     不能凭空发明字形（figma-restore 项目一贯原则：没有源就不编造）
  2. 「融」是这个字最初就承载的品牌语义核心——news.json 里创始人来信原文反复强调
     "'融' 字...evokes melting, blending, convergence, fluid exchange"，单字比取
     "R"/"M" 首字母更贴合品牌
  3. 单个方块字在 16px 小尺寸下比拉丁全称/四字词组更容易辨认，原生适合 favicon 尺度
  路径坐标未做任何改动，直接复用；仅通过 viewBox 偏移+留白把它从 221×77 的横向
  wordmark 画布里单独取景成一个近似正方形。填充黑色，透明背景，与全站默认
  logo-black.svg 用色一致（仅首页 hero 叠加态用白色，favicon 场景没有对应语境，
  取更通用的黑色）。
-->
